name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.5.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build Windows
        working-directory: Birilium/wallet
        run: npm run build:win

      - name: Copy installation instructions
        working-directory: Birilium/wallet
        run: |
          Copy-Item "INSTALL-WINDOWS.txt" -Destination "distribution/README-INSTALL.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Windows-Setup
          path: |
            Birilium/wallet/distribution/*.exe
            Birilium/wallet/distribution/README-INSTALL.txt
          retention-days: 90

      - name: Create portable ZIP
        working-directory: Birilium/wallet/distribution
        run: |
          Copy-Item "..\INSTALL-WINDOWS.txt" -Destination "win-unpacked\README-INSTALL.txt"
          Compress-Archive -Path "win-unpacked\*" -DestinationPath "Birilium-Wallet-Portable-Win64.zip"

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Windows-Portable
          path: Birilium/wallet/distribution/Birilium-Wallet-Portable-Win64.zip
          retention-days: 90

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build macOS (Apple Silicon)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:arm64

      - name: Build macOS (Intel)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:x64

      - name: Copy installation instructions
        working-directory: Birilium/wallet
        run: cp INSTALL-MACOS.txt distribution/README-INSTALL.txt

      - name: List and rename distribution files
        working-directory: Birilium/wallet/distribution
        run: |
          echo "Files before rename:"
          ls -la *.dmg || true
          # Rename files to have clear architecture names
          for f in *.dmg; do
            if [[ "$f" == *"arm64"* ]]; then
              mv "$f" "Birilium-Wallet-macOS-ARM64.dmg" 2>/dev/null || true
            elif [[ "$f" == *"x64"* ]]; then
              mv "$f" "Birilium-Wallet-macOS-Intel.dmg" 2>/dev/null || true
            elif [[ ! "$f" == *"ARM64"* ]] && [[ ! "$f" == *"Intel"* ]]; then
              # If no arch suffix, assume it's Intel (x64 is often default)
              mv "$f" "Birilium-Wallet-macOS-Intel.dmg" 2>/dev/null || true
            fi
          done
          echo "Files after rename:"
          ls -la *.dmg || true

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS-ARM64
          path: |
            Birilium/wallet/distribution/Birilium-Wallet-macOS-ARM64.dmg
            Birilium/wallet/distribution/README-INSTALL.txt
          retention-days: 90

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS-Intel
          path: |
            Birilium/wallet/distribution/Birilium-Wallet-macOS-Intel.dmg
            Birilium/wallet/distribution/README-INSTALL.txt
          retention-days: 90

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build Linux
        working-directory: Birilium/wallet
        run: npm run build:linux

      - name: Copy installation instructions
        working-directory: Birilium/wallet
        run: cp INSTALL-LINUX.txt distribution/README-INSTALL.txt

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Linux-AppImage
          path: |
            Birilium/wallet/distribution/*.AppImage
            Birilium/wallet/distribution/README-INSTALL.txt
          retention-days: 90

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Linux-DEB
          path: |
            Birilium/wallet/distribution/*.deb
            Birilium/wallet/distribution/README-INSTALL.txt
          retention-days: 90

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List downloaded files
        run: find release-assets -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.zip
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            Birilium/wallet/INSTALL-WINDOWS.txt
            Birilium/wallet/INSTALL-MACOS.txt
            Birilium/wallet/INSTALL-LINUX.txt
          draft: false
          generate_release_notes: true
          body: |
            ## Birilium Wallet v${{ github.ref_name }}

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | **Windows** | `*-Setup-*.exe` | Windows Installer (recommended) |
            | **Windows** | `*-Portable-*.zip` | Portable version (no install needed) |
            | **macOS ARM** | `*-arm64.dmg` | For Apple Silicon (M1/M2/M3/M4) |
            | **macOS Intel** | `*-x64.dmg` | For Intel Macs |
            | **Linux** | `*.AppImage` | Universal Linux (all distros) |
            | **Linux** | `*.deb` | Debian/Ubuntu package |

            ### Installation Instructions
            - `INSTALL-WINDOWS.txt` - Windows installation guide
            - `INSTALL-MACOS.txt` - macOS installation guide
            - `INSTALL-LINUX.txt` - Linux installation guide

            ### First Time Setup
            1. Download the correct version for your system
            2. Follow the installation instructions
            3. Create a new wallet or import existing
            4. **IMPORTANT:** Save your recovery phrase securely!

            ### Security Note
            - Built automatically from source code
            - No credentials or private keys included
            - Unsigned builds - follow OS instructions to allow

            ### Support
            - Website: https://birilium.com
            - Email: biriliumcoin@gmail.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
