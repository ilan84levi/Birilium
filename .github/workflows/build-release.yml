name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.5.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const artifacts = data.artifacts || [];
              console.log(`Found ${artifacts.length} artifacts`);
              if (artifacts.length === 0) {
                console.log('No artifacts to delete, skipping');
                return;
              }
              for (const artifact of artifacts) {
                try {
                  console.log(`Deleting: ${artifact.name} (${(artifact.size_in_bytes / 1048576).toFixed(1)} MB)`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                } catch (e) {
                  console.log(`Warning: Could not delete ${artifact.name}: ${e.message}`);
                }
              }
              console.log('Artifact cleanup complete');
            } catch (e) {
              console.log(`Warning: Could not list artifacts: ${e.message}`);
            }

      - name: Delete previous releases (keep only latest)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const currentTag = context.ref.replace('refs/tags/', '');
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              console.log(`Found ${releases.length} releases, current tag: ${currentTag}`);
              for (const release of releases) {
                if (release.tag_name !== currentTag) {
                  try {
                    console.log(`Deleting old release: ${release.tag_name}`);
                    await github.rest.repos.deleteRelease({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      release_id: release.id
                    });
                  } catch (e) {
                    console.log(`Warning: Could not delete release ${release.tag_name}: ${e.message}`);
                  }
                }
              }
              console.log('Release cleanup complete');
            } catch (e) {
              console.log(`Warning: Could not list releases: ${e.message}`);
            }

  build-windows:
    needs: [cleanup]
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build Windows
        working-directory: Birilium/wallet
        run: npm run build:win

      - name: Copy installation instructions
        working-directory: Birilium/wallet
        run: |
          Copy-Item "INSTALL-WINDOWS.txt" -Destination "distribution/INSTALL-WINDOWS.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Windows-Setup
          path: |
            Birilium/wallet/distribution/*.exe
            Birilium/wallet/distribution/INSTALL-WINDOWS.txt
          retention-days: 5

      - name: Create portable ZIP
        working-directory: Birilium/wallet/distribution
        run: |
          Copy-Item "..\INSTALL-WINDOWS.txt" -Destination "win-unpacked\INSTALL-WINDOWS.txt"
          Compress-Archive -Path "win-unpacked\*" -DestinationPath "Birilium-Wallet-Portable-Win64.zip"

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Windows-Portable
          path: Birilium/wallet/distribution/Birilium-Wallet-Portable-Win64.zip
          retention-days: 5

  build-macos:
    needs: [cleanup]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build macOS (Apple Silicon)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:arm64

      - name: Rename ARM64 build
        working-directory: Birilium/wallet/distribution
        run: |
          echo "After ARM64 build:"
          ls -la
          # Find and rename arm64 DMG
          for f in *.dmg; do
            if [[ "$f" == *"arm64"* ]]; then
              cp "$f" "Birilium-Wallet-macOS-ARM64.dmg"
              echo "Renamed $f to Birilium-Wallet-macOS-ARM64.dmg"
            fi
          done

      - name: Build macOS (Intel)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:x64

      - name: Rename Intel build
        working-directory: Birilium/wallet/distribution
        run: |
          echo "After Intel build:"
          ls -la
          # Find and rename x64 DMG (may not have x64 in name)
          for f in *.dmg; do
            if [[ "$f" != *"arm64"* ]] && [[ "$f" != *"ARM64"* ]]; then
              cp "$f" "Birilium-Wallet-macOS-Intel.dmg"
              echo "Renamed $f to Birilium-Wallet-macOS-Intel.dmg"
            fi
          done
          echo "Final files:"
          ls -la *.dmg

      - name: Copy installation instructions
        working-directory: Birilium/wallet
        run: cp INSTALL-MACOS.txt distribution/INSTALL-MACOS.txt

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS-ARM64
          path: |
            Birilium/wallet/distribution/Birilium-Wallet-macOS-ARM64.dmg
            Birilium/wallet/distribution/INSTALL-MACOS.txt
          retention-days: 5

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS-Intel
          path: |
            Birilium/wallet/distribution/Birilium-Wallet-macOS-Intel.dmg
            Birilium/wallet/distribution/INSTALL-MACOS.txt
          retention-days: 5

  build-linux:
    needs: [cleanup]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build Linux
        working-directory: Birilium/wallet
        run: npm run build:linux

      - name: Copy installation instructions
        working-directory: Birilium/wallet
        run: cp INSTALL-LINUX.txt distribution/INSTALL-LINUX.txt

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Linux-AppImage
          path: |
            Birilium/wallet/distribution/*.AppImage
            Birilium/wallet/distribution/INSTALL-LINUX.txt
          retention-days: 5

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-Linux-DEB
          path: |
            Birilium/wallet/distribution/*.deb
            Birilium/wallet/distribution/INSTALL-LINUX.txt
          retention-days: 5

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List downloaded files
        run: find release-assets -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.zip
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.txt
          draft: false
          generate_release_notes: true
          body: |
            ## Birilium Wallet v${{ github.ref_name }}

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | **Windows** | `*-Setup-*.exe` | Windows Installer (recommended) |
            | **Windows** | `*-Portable-*.zip` | Portable version (no install needed) |
            | **macOS ARM** | `*-arm64.dmg` | For Apple Silicon (M1/M2/M3/M4) |
            | **macOS Intel** | `*-x64.dmg` | For Intel Macs |
            | **Linux** | `*.AppImage` | Universal Linux (all distros) |
            | **Linux** | `*.deb` | Debian/Ubuntu package |

            ### Installation Instructions
            - `INSTALL-WINDOWS.txt` - Windows installation guide
            - `INSTALL-MACOS.txt` - macOS installation guide
            - `INSTALL-LINUX.txt` - Linux installation guide

            ### First Time Setup
            1. Download the correct version for your system
            2. Follow the installation instructions
            3. Create a new wallet or import existing
            4. **IMPORTANT:** Save your recovery phrase securely!

            ### Security Note
            - Built automatically from source code
            - No credentials or private keys included
            - Unsigned builds - follow OS instructions to allow

            ### Support
            - Website: https://birilium.com
            - Email: biriliumcoin@gmail.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
