name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read   # build job only needs to read source

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write   # needs to upload to the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build macOS (Apple Silicon)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:arm64

      - name: Build macOS (Intel)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:x64

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS
          path: Birilium/wallet/dist/*.dmg
          retention-days: 90

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS-zip
          path: Birilium/wallet/dist/*.zip
          retention-days: 90

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned SHA — see build-release.yml for rationale.
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          files: |
            Birilium/wallet/dist/*.dmg
            Birilium/wallet/dist/*.zip
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
