name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Birilium/wallet/package-lock.json

      - name: Install main dependencies
        working-directory: Birilium/wallet
        run: npm ci

      - name: Install backend dependencies
        working-directory: Birilium/wallet/node-backend
        run: npm ci

      - name: Build macOS (Apple Silicon)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:arm64

      - name: Build macOS (Intel)
        working-directory: Birilium/wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:x64

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS
          path: Birilium/wallet/dist/*.dmg
          retention-days: 90

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Birilium-Wallet-macOS-zip
          path: Birilium/wallet/dist/*.zip
          retention-days: 90

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Birilium/wallet/dist/*.dmg
            Birilium/wallet/dist/*.zip
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
