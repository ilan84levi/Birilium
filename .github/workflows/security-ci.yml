name: Security CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security scan every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Birilium/package-lock.json'

      - name: Install (blockchain node)
        run: cd Birilium && npm ci --omit=dev

      # Block on critical / high in production deps. continue-on-error was
      # the reason this workflow never failed even when 100+ vulnerabilities
      # accumulated — failures are silent if the gate doesn't gate.
      - name: npm audit (blockchain node, production)
        run: cd Birilium && npm audit --omit=dev --audit-level=high

  wallet-audit:
    name: Wallet Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Birilium/wallet/package-lock.json'

      - name: Install (wallet)
        run: cd Birilium/wallet && npm ci --omit=dev

      - name: npm audit (wallet, production)
        run: cd Birilium/wallet && npm audit --omit=dev --audit-level=high

  node-backend-audit:
    name: Node Backend Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Birilium/wallet/node-backend/package-lock.json'

      - name: Install (node-backend)
        run: cd Birilium/wallet/node-backend && npm ci --omit=dev

      - name: npm audit (node-backend, production)
        run: cd Birilium/wallet/node-backend && npm audit --omit=dev --audit-level=high

  secret-scanning:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      # Pinned to a release tag, not @main. trufflesecurity/trufflehog is a
      # high-value supply-chain target — if @main were compromised it'd run
      # with checkout-level access to every commit in our history.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.82.6
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # No --no-fail — let it block the build when secrets are found.
          extra_args: --only-verified

  dependency-review:
    name: Dependency Review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
