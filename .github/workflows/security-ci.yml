name: Security CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security scan every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Birilium/package-lock.json'

      - name: Install dependencies (blockchain node)
        run: |
          cd Birilium
          npm ci --omit=dev

      - name: Run npm audit (blockchain node)
        continue-on-error: true
        run: |
          cd Birilium
          npm audit --production --audit-level=moderate || echo "npm audit found issues"

      - name: Run NodeSecure CI (blockchain node)
        continue-on-error: true
        run: |
          cd Birilium
          npx @nodesecure/ci || echo "NodeSecure found issues"

      - name: Check for outdated packages (blockchain node)
        continue-on-error: true
        run: |
          cd Birilium
          npx npm-check-updates --errorLevel 2 || echo "Outdated packages found"

  wallet-audit:
    name: Wallet Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Birilium/wallet/package-lock.json'

      - name: Install dependencies (wallet)
        run: |
          cd Birilium/wallet
          npm ci --omit=dev

      - name: Run npm audit (wallet)
        continue-on-error: true
        run: |
          cd Birilium/wallet
          npm audit --production --audit-level=moderate || echo "npm audit found issues"

      - name: Run NodeSecure CI (wallet)
        continue-on-error: true
        run: |
          cd Birilium/wallet
          npx @nodesecure/ci || echo "NodeSecure found issues"

      - name: Check for outdated packages (wallet)
        continue-on-error: true
        run: |
          cd Birilium/wallet
          npx npm-check-updates --errorLevel 2 || echo "Outdated packages found"

  code-quality:
    name: Code Quality & Security Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint and security plugins
        run: |
          npm install -g eslint eslint-plugin-security

      - name: Run ESLint security checks
        continue-on-error: true
        run: |
          cd Birilium
          npx eslint --ext .js --plugin security . || echo "ESLint found issues"

  secret-scanning:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run TruffleHog for secret detection
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --fail || echo "Secrets detected"

      - name: Run GitLeaks for credential scanning
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose || echo "Credentials detected"

  dependency-review:
    name: Dependency Review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, wallet-audit, code-quality]
    if: always()

    steps:
      - name: Generate security summary
        run: |
          echo "# Security CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency audit completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Wallet audit completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code quality checks completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Review the logs above for any security issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔒 For detailed security policy, see SECURITY.md" >> $GITHUB_STEP_SUMMARY
