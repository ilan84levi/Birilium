# /etc/nginx/sites-enabled/node.birilium.com
# Serves the Birilium blockchain admin & API over HTTPS for both hostnames.
# Cert is managed by certbot (auto-renews). Don't hand-edit `managed by Certbot` lines.

server {
    server_name node.birilium.com api.birilium.com;

    # HSTS — tell browsers to always use HTTPS for this host for 1 year.
    # This permanently fixes Chrome's HTTPS-upgrade quirk because the upgrade
    # is now the documented protocol, not a guess. Set max-age large only after
    # confirming HTTPS works (we did, in this session). `preload` is intentionally
    # omitted until you submit the host to https://hstspreload.org/.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/node.birilium.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/node.birilium.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name node.birilium.com api.birilium.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
