# /etc/nginx/sites-available/node.birilium.com
#
# Birilium node HTTPS reverse proxy.
# TLS is added by certbot --nginx -d node.birilium.com (do not hand-edit the
# managed-by-Certbot lines after first issuance).

server {
    listen 80;
    listen [::]:80;
    server_name node.birilium.com;

    # Allow Let's Encrypt http-01 challenge, redirect everything else.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name node.birilium.com;

    # ssl_certificate / ssl_certificate_key inserted by certbot

    # Reasonable upload limit for admin contact messages, audit exports, etc.
    client_max_body_size 10m;

    # Reverse proxy to the node-backend bound to 127.0.0.1:3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket upgrade (admin-websocket + /ws client service)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
